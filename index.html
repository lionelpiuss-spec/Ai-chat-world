
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYBEX - Island Odyssey</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#72d6ed}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:2;background:#08283ddd;padding:12px;border-radius:12px;color:white}
#mission{font-size:13px;margin-top:8px}
#controls{position:fixed;bottom:20px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:3}
#stick{width:120px;height:120px;border:2px solid #fff9;border-radius:50%;background:#ffffff33;position:relative;touch-action:none}
#knob{position:absolute;width:45px;height:45px;border-radius:50%;background:white;left:35px;top:35px}
button{border:0;border-radius:14px;padding:15px;background:#087ca5;color:white;font-weight:bold}
#start{position:fixed;inset:0;background:linear-gradient(#063b60aa,#031a32ee);z-index:10;display:grid;place-items:center;text-align:center;color:white}
#start button{background:#11d8c0;color:#042b35;font-size:18px}
#message{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);z-index:2;background:#08283ddd;color:white;padding:10px;border-radius:10px;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">
 <b style="font-size:20px;color:#65eaff">VYBEX</b><br>
 ISLAND ODYSSEY
 <div>🪙 Coins: <span id="coins">0</span></div>
 <div id="mission">Mission: Find the treasure</div>
</div>
<div id="message">Explore the island!</div>
<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <button id="collect">PICK UP</button>
</div>
<div id="start">
 <div>
  <h1 style="font-size:38px;color:#62eaff">VYBEX</h1>
  <h2>ISLAND ODYSSEY</h2>
  <p>Explore the tropical island.</p>
  <p>Find hidden treasure and discover new places.</p>
  <button id="play">ENTER ISLAND</button>
 </div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from "three";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x85d9f5);
scene.fog=new THREE.Fog(0x85d9f5,90,180);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8f5ff,0x476b37,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-30,60,30);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color});
const grass=mat(0x37994d);
const sand=mat(0xe9d09a);
const wood=mat(0x80502d);
const green=mat(0x16834c);

function heightAt(x,z){
 return Math.max(0,5-Math.hypot(x,z)*.075)
 +Math.sin(x*.16)*Math.cos(z*.13);
}

// Island ground
const terrain=new THREE.PlaneGeometry(125,125,90,90);
terrain.rotateX(-Math.PI/2);
const p=terrain.attributes.position;
for(let i=0;i<p.count;i++){
 let x=p.getX(i),z=p.getZ(i);
 p.setY(i,heightAt(x,z)-Math.max(0,Math.hypot(x,z)-45)*.2);
}
terrain.computeVertexNormals();
const land=new THREE.Mesh(terrain,grass);
land.receiveShadow=true;
scene.add(land);

// Beach
const beach=new THREE.Mesh(
 new THREE.RingGeometry(43,56,100),
 sand
);
beach.rotation.x=-Math.PI/2;
beach.position.y=.03;
scene.add(beach);

// Ocean
const oceanGeo=new THREE.PlaneGeometry(260,260,70,70);
oceanGeo.rotateX(-Math.PI/2);
const ocean=new THREE.Mesh(oceanGeo,
 new THREE.MeshStandardMaterial({
  color:0x078fc5,roughness:.25,metalness:.15
 })
);
ocean.position.y=-1.4;
scene.add(ocean);
const waterPos=oceanGeo.attributes.position;
const base=[];
for(let i=0;i<waterPos.count;i++)base.push(waterPos.getY(i));

// Tree helper
function tree(x,z){
 const y=heightAt(x,z);
 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.45,5,8),wood
 );
 trunk.position.set(x,y+2.5,z);
 trunk.castShadow=true;
 scene.add(trunk);
 for(let i=0;i<6;i++){
  const a=i*Math.PI/3;
  const leaf=new THREE.Mesh(
   new THREE.ConeGeometry(.7,4,5),green
  );
  leaf.position.set(
   x+Math.cos(a)*1.1,y+5,z+Math.sin(a)*1.1
  );
  leaf.rotation.z=Math.cos(a)*.8;
  leaf.rotation.x=Math.sin(a)*.8;
  scene.add(leaf);
 }
}
for(let i=0;i<100;i++){
 const a=Math.random()*Math.PI*2;
 const r=13+Math.random()*29;
 tree(Math.cos(a)*r,Math.sin(a)*r);
}

// Houses
function box(x,y,z,w,h,d,material){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 o.position.set(x,y,z);
 o.castShadow=true;
 scene.add(o);
 return o;
}
function house(x,z){
 const y=heightAt(x,z);
 box(x,y+1.4,z,6,2.8,5,mat(0xe5c48b));
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(4.5,3,4),mat(0x9a4830)
 );
 roof.position.set(x,y+4,z);
 roof.rotation.y=Math.PI/4;
 scene.add(roof);
 box(x,y+1,z+2.55,1,2,.12,wood);
}
house(8,8);house(17,4);house(10,17);house(-12,10);

// Mountain
const mountain=new THREE.Mesh(
 new THREE.ConeGeometry(16,22,8),mat(0x527a51)
);
mountain.position.set(-15,12,-20);
scene.add(mountain);

// Dock
for(let i=0;i<9;i++)box(0,.1,48+i*2,5,.35,1.8,wood);

// Player
const player=new THREE.Group();
scene.add(player);
const shirt=mat(0x1267d5),skin=mat(0xd69a70),pants=mat(0x242c40);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.5,.8,4,8),shirt);
body.position.y=1.5;
player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),skin);
head.position.y=2.45;
player.add(head);
const legs=[];
for(const x of [-.22,.22]){
 const leg=new THREE.Mesh(new THREE.CylinderGeometry(.17,.2,.8,8),pants);
 leg.position.set(x,.55,0);
 player.add(leg);
 legs.push(leg);
}
player.position.set(0,heightAt(0,0),0);

// Treasure chest
const chest=new THREE.Group();
const tx=-25,tz=-10;
chest.position.set(tx,heightAt(tx,tz),tz);
scene.add(chest);
const chestBody=new THREE.Mesh(
 new THREE.BoxGeometry(1.7,1,1.2),mat(0x99531d)
);
chestBody.position.y=.5;
chest.add(chestBody);
const chestLid=new THREE.Mesh(
 new THREE.BoxGeometry(1.8,.25,1.3),mat(0xffc83d)
);
chestLid.position.y=1.1;
chest.add(chestLid);
const glow=new THREE.PointLight(0xffd34c,5,12);
glow.position.y=2;
chest.add(glow);

let coins=0,found=false;
const msg=document.getElementById("message");
function collect(){
 if(found)return;
 if(player.position.distanceTo(chest.position)<5){
  found=true;coins+=100;
  document.getElementById("coins").textContent=coins;
  document.getElementById("mission").textContent="Mission completed!";
  chest.visible=false;
  msg.textContent="🏆 Treasure found! +100 coins";
 }else msg.textContent="Move closer to the treasure!";
}
document.getElementById("collect").onclick=collect;
window.addEventListener("keydown",e=>{
 if(e.key.toLowerCase()==="e")collect();
});

// Touch joystick
let joyX=0,joyY=0,pointer=null;
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
function reset(){
 pointer=null;joyX=joyY=0;
 knob.style.left="35px";knob.style.top="35px";
}
stick.addEventListener("pointerdown",e=>{
 pointer=e.pointerId;stick.setPointerCapture(pointer);move(e);
});
stick.addEventListener("pointermove",e=>{
 if(pointer===e.pointerId)move(e);
});
function move(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const l=Math.hypot(dx,dy),max=38;
 if(l>max){dx*=max/l;dy*=max/l;}
 joyX=dx/max;joyY=dy/max;
 knob.style.left=(35+dx)+"px";
 knob.style.top=(35+dy)+"px";
}
stick.addEventListener("pointerup",reset);
stick.addEventListener("pointercancel",reset);

const keys={};
window.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const clock=new THREE.Clock();
let walk=0;

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 const dt=Math.min(clock.getDelta(),.04);

 // Animated ocean
 for(let i=0;i<waterPos.count;i++){
  const x=waterPos.getX(i),z=waterPos.getZ(i);
  waterPos.setY(i,base[i]+Math.sin(x*.12+t*1.5)*.16+
    Math.cos(z*.15+t)*.12);
 }
 waterPos.needsUpdate=true;
 oceanGeo.computeVertexNormals();

 // Character movement
 let f=0,s=0;
 if(keys.w||keys.arrowup)f++;
 if(keys.s||keys.arrowdown)f--;
 if(keys.a||keys.arrowleft)s--;
 if(keys.d||keys.arrowright)s++;
 f-=joyY;s+=joyX;
 const len=Math.hypot(f,s);
 if(len>1){f/=len;s/=len;}
 if(len>.08){
  player.position.x+=s*7*dt;
  player.position.z-=f*7*dt;
  player.rotation.y=Math.atan2(s,f);
  walk+=dt*10;
  legs[0].rotation.x=Math.sin(walk)*.6;
  legs[1].rotation.x=-Math.sin(walk)*.6;
 }else legs.forEach(l=>l.rotation.x=0);

 // Keep player on island
 const d=Math.hypot(player.position.x,player.position.z);
 if(d>43){
  player.position.x*=43/d;
  player.position.z*=43/d;
 }
 player.position.y=heightAt(player.position.x,player.position.z);

 // Follow camera
 const target=new THREE.Vector3(
  player.position.x,player.position.y+8,player.position.z+12
 );
 camera.position.lerp(target,.09);
 camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);

 if(!found)glow.intensity=4+Math.sin(t*3);
 renderer.render(scene,camera);
}
animate();

document.getElementById("play").onclick=()=>{
 document.getElementById("start").style.display="none";
};

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
