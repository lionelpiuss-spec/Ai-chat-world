
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYBEX - Island Odyssey</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#62c9e8;font-family:Arial;color:white}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;z-index:5}
.panel{background:#071d2ccc;padding:12px 16px;border:1px solid #ffffff44;border-radius:14px}
#title{font-size:19px;font-weight:bold;color:#69e5ff}
#mission{font-size:13px;margin-top:6px}
#coins{margin-top:7px;color:#ffe16b}
#help{position:fixed;top:12px;right:12px;z-index:5;text-align:right;font-size:12px}
#controls{position:fixed;bottom:20px;left:20px;right:20px;z-index:5;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:120px;height:120px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;position:relative;pointer-events:auto;touch-action:none}
#knob{width:48px;height:48px;border-radius:50%;background:#ffffffbb;position:absolute;left:34px;top:34px}
#actions{display:flex;gap:12px;pointer-events:auto}
.action{width:65px;height:65px;border-radius:50%;border:2px solid white;background:#087caa;color:white;font-weight:bold;font-size:13px;touch-action:none}
#message{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);background:#071d2ccc;padding:10px 16px;border-radius:12px;z-index:5;text-align:center;font-size:13px;white-space:nowrap}
#start{position:fixed;inset:0;background:linear-gradient(#063e62aa,#031a32ee);z-index:10;display:flex;align-items:center;justify-content:center;text-align:center}
#startBox{padding:25px;max-width:350px}
#start h1{font-size:34px;color:#6ceaff}
#start button{padding:15px 30px;border:0;border-radius:12px;background:#00bde9;color:#001c2a;font-size:17px;font-weight:bold}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">
  <div id="title">VYBEX 🌴</div>
  <div>ISLAND ODYSSEY</div>
  <div id="mission">Mission: Find the hidden treasure</div>
  <div id="coins">🪙 Coins: <span id="score">0</span></div>
 </div>
</div>

<div id="help" class="panel">
 Explore the island<br>
 WASD / Arrow keys<br>
 E = Collect treasure
</div>

<div id="message">Explore the island and find the treasure!</div>

<div id="controls">
 <div id="stick"><div id="knob"></div></div>
 <div id="actions">
  <button class="action" id="run">RUN</button>
  <button class="action" id="interact">PICK UP</button>
 </div>
</div>

<div id="start">
 <div id="startBox">
  <h1>VYBEX</h1>
  <h2>ISLAND ODYSSEY</h2>
  <p>Discover a tropical world. Explore beaches, forests and hidden treasures.</p>
  <button id="play">ENTER ISLAND</button>
 </div>
</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87d9f5);
scene.fog = new THREE.Fog(0x87d9f5,90,190);

const camera = new THREE.PerspectiveCamera(
 65,window.innerWidth/window.innerHeight,0.1,400
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xc8f3ff,0x557044,2));

const sun = new THREE.DirectionalLight(0xffffff,2.3);
sun.position.set(-40,70,30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

// MATERIALS
const sand = new THREE.MeshStandardMaterial({color:0xe9d19a});
const grass = new THREE.MeshStandardMaterial({color:0x399b55});
const wood = new THREE.MeshStandardMaterial({color:0x80502d});
const leaf = new THREE.MeshStandardMaterial({color:0x16834c});
const waterMat = new THREE.MeshStandardMaterial({
 color:0x078fc1,
 roughness:0.25,
 metalness:0.18,
 transparent:true,
 opacity:0.92
});

// ISLAND TERRAIN
function heightAt(x,z){
 const d=Math.sqrt(x*x+z*z);
 return Math.max(0,5-d*0.075)+
 Math.sin(x*.16)*Math.cos(z*.13)*1.1+
 Math.sin(z*.31+x*.1)*.4;
}

const geo = new THREE.PlaneGeometry(125,125,110,110);
geo.rotateX(-Math.PI/2);
const pos=geo.attributes.position;

for(let i=0;i<pos.count;i++){
 const x=pos.getX(i),z=pos.getZ(i);
 const d=Math.sqrt(x*x+z*z);
 pos.setY(i,heightAt(x,z)-Math.max(0,d-45)*.22);
}
geo.computeVertexNormals();

const island = new THREE.Mesh(geo,grass);
island.receiveShadow=true;
scene.add(island);

// BEACH RING
const beachGeo = new THREE.RingGeometry(43,57,100);
beachGeo.rotateX(-Math.PI/2);
const beach = new THREE.Mesh(beachGeo,sand);
beach.position.y=.05;
scene.add(beach);

// OCEAN
const waterGeo=new THREE.PlaneGeometry(260,260,100,100);
waterGeo.rotateX(-Math.PI/2);
const water=new THREE.Mesh(waterGeo,waterMat);
water.position.y=-1.3;
scene.add(water);
const waterPositions=waterGeo.attributes.position;
const originalWater=[];
for(let i=0;i<waterPositions.count;i++){
 originalWater.push(waterPositions.getY(i));
}

// OBJECT HELPERS
function box(x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

function cylinder(x,y,z,r1,r2,h,mat){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,10),mat);
 m.position.set(x,y,z);
 m.castShadow=true;
 scene.add(m);
 return m;
}

// PALM TREES
function palm(x,z){
 const y=heightAt(x,z);
 cylinder(x,y+3,z,.35,.55,6,wood);

 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const branch=new THREE.Mesh(
   new THREE.ConeGeometry(.55,4,5),leaf
  );
  branch.position.set(
   x+Math.cos(a)*1.3,
   y+5.1,
   z+Math.sin(a)*1.3
  );
  branch.rotation.z=Math.cos(a)*.9;
  branch.rotation.x=Math.sin(a)*.9;
  branch.castShadow=true;
  scene.add(branch);
 }
 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(.7,8,8),leaf
 );
 crown.position.set(x,y+5.7,z);
 scene.add(crown);
}

// FOREST
for(let i=0;i<100;i++){
 const a=Math.random()*Math.PI*2;
 const r=14+Math.random()*34;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;
 if(Math.sqrt(x*x+z*z)<42)palm(x,z);
}

// MOUNTAIN
const mountainMat=new THREE.MeshStandardMaterial({color:0x56805a});
const mountain=new THREE.Mesh(
 new THREE.ConeGeometry(17,22,8),mountainMat
);
mountain.position.set(-13,13,-19);
mountain.castShadow=true;
scene.add(mountain);

// VILLAGE HOUSES
function house(x,z){
 const y=heightAt(x,z);
 box(x,y+1.5,z,6,3,5,
  new THREE.MeshStandardMaterial({color:0xe4c18a}));
 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(4.7,3.2,4),
  new THREE.MeshStandardMaterial({color:0x9b4931})
 );
 roof.position.set(x,y+4.4,z);
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 scene.add(roof);

 box(x,y+1,z+2.55,1.1,2,0.12,wood);
 box(x-1.7,y+1.8,z+2.58,1,.8,.12,
  new THREE.MeshStandardMaterial({color:0x74d5ef}));
 box(x+1.7,y+1.8,z+2.58,1,.8,.12,
  new THREE.MeshStandardMaterial({color:0x74d5ef}));
}

house(8,8);
house(17,4);
house(10,17);
house(-10,13);

// DOCK
for(let i=0;i<9;i++){
 box(0,.2,48+i*2,5,.4,1.8,wood);
}
for(const x of [-2.2,2.2]){
 for(let z=48;z<66;z+=6){
  cylinder(x,-.8,z,.18,.18,3,wood);
 }
}

// ROCKS
for(let i=0;i<35;i++){
 const a=Math.random()*Math.PI*2;
 const r=20+Math.random()*30;
 const x=Math.cos(a)*r,z=Math.sin(a)*r;
 const rock=new THREE.Mesh(
  new THREE.DodecahedronGeometry(.7+Math.random()*1.1,0),
  new THREE.MeshStandardMaterial({color:0x777e7a})
 );
 rock.position.set(x,heightAt(x,z)+.4,z);
 rock.scale.y=.7;
 scene.add(rock);
}

// PLAYER
const player=new THREE.Group();
scene.add(player);

const skin=new THREE.MeshStandardMaterial({color:0xd99a69});
const shirt=new THREE.MeshStandardMaterial({color:0x176be0});
const pants=new THREE.MeshStandardMaterial({color:0x252b3d});

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.55,.9,4,8),shirt
);
body.position.y=1.5;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.43,16,12),skin
);
head.position.y=2.55;
player.add(head);

const legs=[];
for(const x of [-.23,.23]){
 const leg=new THREE.Mesh(
  new THREE.CylinderGeometry(.18,.2,.8,8),pants
 );
 leg.position.set(x,.55,0);
 player.add(leg);
 legs.push(leg);
}
player.position.set(0,heightAt(0,0),0);

// TREASURE
const chest=new THREE.Group();
const chestX=-25,chestZ=-10;
chest.position.set(chestX,heightAt(chestX,chestZ)+.5,chestZ);
scene.add(chest);

const chestBox=new THREE.Mesh(
 new THREE.BoxGeometry(1.7,1.1,1.2),
 new THREE.MeshStandardMaterial({color:0x9b5723})
);
chestBox.position.y=.55;
chest.add(chestBox);

const lid=new THREE.Mesh(
 new THREE.BoxGeometry(1.8,.25,1.3),
 new THREE.MeshStandardMaterial({color:0xffc343})
);
lid.position.y=1.15;
chest.add(lid);

const treasureLight=new THREE.PointLight(0xffd54a,5,12);
treasureLight.position.y=2;
chest.add(treasureLight);

// COIN DISPLAY
let coins=0;
let collected=false;
const score=document.getElementById("score");
const message=document.getElementById("message");

// INPUT
const keys={};
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="e")collect();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let joyX=0,joyY=0;
let running=false;

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let pointer=null;

stick.addEventListener("pointerdown",e=>{
 pointer=e.pointerId;
 stick.setPointerCapture(pointer);
 moveStick(e);
});
stick.addEventListener("pointermove",e=>{
 if(pointer===e.pointerId)moveStick(e);
});
function moveStick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=40;
 const length=Math.hypot(dx,dy);
 if(length>max){dx=dx/length*max;dy=dy/length*max;}
 joyX=dx/max;
 joyY=dy/max;
 knob.style.left=(34+dx)+"px";
 knob.style.top=(34+dy)+"px";
}
function resetStick(){
 pointer=null;joyX=0;joyY=0;
 knob.style.left="34px";knob.style.top="34px";
}
stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

document.getElementById("run").addEventListener("pointerdown",()=>running=true);
document.getElementById("run").addEventListener("pointerup",()=>running=false);
document.getElementById("run").addEventListener("pointerleave",()=>running=false);
document.getElementById("interact").addEventListener("click",collect);

function collect(){
 if(collected)return;
 const d=player.position.distanceTo(chest.position);
 if(d<5){
  collected=true;
  coins+=100;
  score.textContent=coins;
  chest.visible=false;
  document.getElementById("mission").textContent="Mission complete!";
  message.textContent="🏆 Treasure discovered! You earned 100 coins!";
 }else{
  message.textContent="Get closer to the treasure chest!";
 }
}

// GAME LOOP
const clock=new THREE.Clock();
let walkTime=0;

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 const dt=Math.min(clock.getDelta(),.04);

 // WATER WAVES
 for(let i=0;i<waterPositions.count;i++){
  const x=waterPositions.getX(i);
  const z=waterPositions.getZ(i);
  waterPositions.setY(
   i,originalWater[i]+
   Math.sin(x*.12+t*1.5)*.16+
   Math.cos(z*.15+t)*.12
  );
 }
 waterPositions.needsUpdate=true;
 waterGeo.computeVertexNormals();

 // MOVEMENT
 let forward=0,side=0;
 if(keys["w"]||keys["arrowup"])forward=1;
 if(keys["s"]||keys["arrowdown"])forward=-1;
 if(keys["a"]||keys["arrowleft"])side=-1;
 if(keys["d"]||keys["arrowright"])side=1;

 forward+=-joyY;
 side+=joyX;

 const length=Math.hypot(forward,side);
 if(length>1){forward/=length;side/=length;}

 const speed=running?13:7;
 const moving=length>.08;

 if(moving){
  const angle=Math.atan2(side,forward);
  player.rotation.y=angle;
  player.position.x+=side*speed*dt;
  player.position.z-=forward*speed*dt;
  walkTime+=dt*(running?15:9);
  legs[0].rotation.x=Math.sin(walkTime)*.65;
  legs[1].rotation.x=-Math.sin(walkTime)*.65;
 }else{
  legs.forEach(l=>l.rotation.x=0);
 }

 // Keep player on island
 const distance=Math.hypot(player.position.x,player.position.z);
 if(distance>43){
  player.position.x*=43/distance;
  player.position.z*=43/distance;
 }
 player.position.y=heightAt(player.position.x,player.position.z);

 // CAMERA FOLLOW
 const desired=new THREE.Vector3(
  player.position.x,
  player.position.y+8,
  player.position.z+12
 );
 camera.position.lerp(desired,.08);
 camera.lookAt(
  player.position.x,
  player.position.y+1.5,
  player.position.z
 );

 // TREASURE GLOW
 if(!collected){
  chest.rotation.y=Math.sin(t*.7)*.12;
  treasureLight.intensity=4+Math.sin(t*3)*1.5;
 }

 renderer.render(scene,camera);
}

animate();

// START GAME
document.getElementById("play").addEventListener("click",()=>{
 document.getElementById("start").style.display="none";
});

// RESIZE
window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
